# ============================================================
# 一键发布安装包（GitHub 自动构建）
# ------------------------------------------------------------
# 原理：推送一个 v 开头的版本标签后，GitHub 的服务器会自动
# 构建 Mac 版和 Windows 版安装包，并挂到项目页面的 Releases
# （发行版）区域，访客点开即可直接下载。
#
# 发版步骤（三步）：
#   1. 打开 backend/tauri.conf.json，把 "version" 改成新版本号
#      （例如 2.1.0，建议同时把 backend/Cargo.toml 里的版本号改成一致）
#   2. 提交：git add -A && git commit -m "发布 v2.1.0"
#   3. 打标签并推送：git tag v2.1.0 && git push && git push origin v2.1.0
#      （标签名 v 后面的数字要跟步骤 1 的版本号一致）
# 之后等大约 10~20 分钟，Releases 页面就会出现 Mac / Windows 安装包。
# ============================================================

name: 发布安装包

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    # 需要写权限：用来在 GitHub 上创建发布并上传安装包
    permissions:
      contents: write
    strategy:
      # 两个平台互相独立，一个失败不影响另一个继续
      fail-fast: false
      matrix:
        include:
          # Mac：构建"通用版"，苹果 M 系列芯片和 Intel 老 Mac 都能用
          - platform: macos-latest
            args: '--config backend/tauri.conf.json --target universal-apple-darwin'
          # Windows：构建安装包
          - platform: windows-latest
            args: '--config backend/tauri.conf.json'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # 只有 Mac 需要安装两个芯片架构的编译目标（用来合成通用版）
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: 安装前端依赖
        run: npm ci

      - name: 构建安装包并发布到 Releases
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: OneLedger v__VERSION__
          releaseBody: |
            OneLedger v__VERSION__ 发布了 🎉

            ## 📥 下载安装包

            - **🍎 Mac**：下载 `OneLedger_v__VERSION___universal.dmg`（通用版，苹果 M 系列芯片和 Intel 老 Mac 都支持）
            - **🪟 Windows**：下载 `OneLedger_v__VERSION___x64-setup.exe`（安装程序）

            > Mac 版还会附带一个 `OneLedger.app.tar.gz` 压缩包，普通用户忽略它，下载 `.dmg` 文件即可。

            ## ⚠️ 首次打开提示（目前应用没有付费签名证书，属正常现象）

            - **Mac**：打开后系统会提示"无法验证开发者"，请**右键点击「OneLedger」应用图标 → 选择「打开」**，再点一次"打开"即可运行。
            - **Windows**：会提示"已保护你的电脑"，请点击**「更多信息」→「仍要运行」**。
          includeUpdaterJson: false
