[package]
name = "one-ledger"
version = "2.1.0"
description = "一笔（OneLedger）桌面记账应用 —— 个人消费记录与支出管理"
authors = ["musoli314 <musoli314@gmail.com>"]
license = "MIT"
repository = "https://github.com/MuSoli314/OneLedger"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "one_ledger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
